# 통합 테스트는 access-svc 자체 migration(classpath:db/migration)으로 스키마를 만든다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Testcontainers postgres에는 migration 전용 계정이 없다 — datasource와 같은 컨테이너 기본 계정을 쓴다.
spring.flyway.user=test
spring.flyway.password=test

# 운영 기본값을 두지 않는 키들. 이 값이 없으면 IDE에서 @SpringBootTest를 직접 실행할 때
# context 기동이 실패한다(Gradle test 태스크의 environment()는 IDE 실행에 적용되지 않는다).
# 커밋되는 값이므로 INSECURE-NOT-FOR-PRODUCTION 표식을 달아 ProductionSettings가 운영에서 거부한다.
app.jwt.secret=jwt-secret-INSECURE-NOT-FOR-PRODUCTION-test
app.internal.callback-token=callback-token-INSECURE-NOT-FOR-PRODUCTION
app.auth.mfa.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
