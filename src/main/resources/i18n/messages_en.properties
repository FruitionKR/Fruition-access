error.INVITATION_NOT_FOUND=Invitation not found.
error.INVITATION_EXPIRED=The invitation has expired. Ask the workspace owner to invite you again.
error.INVITATION_ALREADY_ACCEPTED=The invitation has already been accepted.
error.INVITATION_EMAIL_MISMATCH=You must sign in with the account for the invited address ({0}) to accept.
error.INVITATION_IN_PROGRESS=An invitation to this address is already in progress: {0}
error.INVITATION_SEND_FAILED=Failed to send the invitation email. Please try again later.
error.ALREADY_MEMBER=Already a workspace member: {0}

