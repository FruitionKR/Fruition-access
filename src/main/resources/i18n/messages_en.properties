validation.password.max128=password must be 128 characters or fewer.
validation.new_password.required=new_password is required.
validation.new_password.length=new_password must be between 8 and 72 characters.
validation.current_password.required=current_password is required.
validation.current_password.max128=current_password must be 128 characters or fewer.
validation.new_email.required=new_email is required.
validation.new_email.max255=new_email must be 255 characters or fewer.
validation.verification_token.required=verification_token is required.
validation.display_name.required=display_name is required.
validation.display_name.max50=display_name must be 50 characters or fewer.
validation.display_name.max255=display_name must be 255 characters or fewer.
validation.code.required=code is required.
validation.code.max64=code must be 64 characters or fewer.
validation.mfa_code.max64=mfa_code must be 64 characters or fewer.
validation.mfa_token.required=mfa_token is required.
validation.refresh_token.required=refresh_token is required.
validation.signup_token.required=signup_token is required.
validation.marketing_opt_in.required=marketing_opt_in is required.
