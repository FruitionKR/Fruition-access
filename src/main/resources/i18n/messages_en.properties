# English message bundle. Used when Accept-Language selects en.
# Messages with arguments ({0}) go through MessageFormat, so a single quote must be written as ''.
# The key set must match messages.properties (MessageBundleConsistencyTest).

# Common errors
error.INVALID_REQUEST=The request is not valid.
error.INVALID_REQUEST.invalid_value=The value is not in a valid format.
error.INVALID_REQUEST.missing_file=The file is missing or empty.
error.REQUEST_FAILED=The request could not be processed.
error.INTERNAL_ERROR=A server error occurred.
error.DUPLICATE_NAME.document=A file with the same name already exists in this workspace. Please use a different name.
error.DUPLICATE_NAME.folder=A folder with the same name already exists in this workspace. Please use a different name.
error.INVALID_IDEMPOTENCY_KEY=Idempotency-Key must be between 1 and 255 characters.
error.IDEMPOTENCY_CONFLICT=The same Idempotency-Key cannot be used for a different request.
error.IDEMPOTENCY_IN_PROGRESS=A request with the same Idempotency-Key is still being processed.
error.INVALID_AI_MODEL.provider_model_pair=provider and model must be sent together.
error.INVALID_AI_MODEL.unavailable=This AI model cannot be selected.
error.INVALID_AI_MODEL.claude_not_allowed=Claude models can only be used when selected directly in chat. Choose an OpenAI or Gemini model for workspace settings.

# Sign-up and authentication
error.DUPLICATE_EMAIL=This email is already registered: email={0}
error.EMAIL_REGISTERED_WITH_OAUTH=This email is already registered with a social account ({0}). Sign in with that account and link it in settings: email={1}
error.EMAIL_REGISTERED=This email is already registered with another method ({0}). Sign in with your existing account and link your {1} account in settings.
error.INVALID_CREDENTIALS=The email or password is incorrect.
error.INVALID_REFRESH_TOKEN=The refresh token is invalid or has expired.
error.LOGIN_RATE_LIMITED=Too many sign-in attempts. Please try again later.
error.PASSWORD_CHANGE_RATE_LIMITED=Too many attempts to confirm your current password. Please try again later.
error.PASSWORD_LOGIN_UNAVAILABLE=This email is registered with {0} sign-in, so a password cannot be set.
error.REAUTHENTICATION_REQUIRED=Please sign in again to confirm it is you, then try again.
error.CONSENT_REQUIRED=You must confirm that you are 18 or older and agree to the current Terms of Service.
error.INVALID_SIGNUP_TOKEN=The sign-up session has expired. Please start again from social sign-in.
error.USER_NOT_FOUND=User not found: id={0}
error.SESSION_NOT_FOUND=Session not found: id={0}
error.SOLE_OWNER_OF_SHARED_WORKSPACE=Transfer OWNER of the workspaces that have other members first.

# Email verification
error.VERIFICATION_NOT_FOUND=The verification request was not found.
error.INVALID_VERIFICATION_CODE=The verification code is incorrect.
error.VERIFICATION_CODE_EXPIRED=The verification code has expired. Please request a new one.
error.VERIFICATION_CODE_ATTEMPTS_EXCEEDED=Too many incorrect verification codes. Please request a new one.
error.INVALID_VERIFICATION_TOKEN=The verification token is invalid.
error.VERIFICATION_RATE_LIMITED=Verification requests are too frequent. Please try again later.
error.EMAIL_AVAILABILITY_RATE_LIMITED=Too many email availability checks. Please try again later.
error.EMAIL_SEND_FAILED=Failed to send the verification email. Please try again later.

# Multi-factor authentication
error.MFA_RATE_LIMITED=Too many MFA verification requests. Please try again later.
error.INVALID_MFA_CODE=The authentication code is incorrect.
error.INVALID_MFA_CHALLENGE=Your sign-in session has expired. Please sign in again.
error.MFA_NOT_ENABLED=Multi-factor authentication is not set up.
error.MFA_ALREADY_ENABLED=Multi-factor authentication is already on. Turn it off before registering again.

# Social accounts
error.INVALID_OAUTH_CODE=The OAuth authorization code is invalid or has expired.
error.OAUTH_EMAIL_NOT_PROVIDED=Could not get the email address from your {0} account.
error.OAUTH_ACCOUNT_NOT_FOUND=No {0} account is linked.
error.UNSUPPORTED_OAUTH_PROVIDER=This social sign-in is not supported: {0}
error.INVALID_OAUTH_LINK_CODE=The link code is invalid or has expired.
error.OAUTH_ACCOUNT_ALREADY_LINKED=The {0} account is already linked.
error.OAUTH_UNLINK_NOT_ALLOWED={0} is the sign-in method used to create this account, so it cannot be unlinked.

# Profile photo
error.UNSUPPORTED_USER_AVATAR.missing_file=A profile photo file is required.
error.UNSUPPORTED_USER_AVATAR.unreadable=The profile photo could not be read.
error.UNSUPPORTED_USER_AVATAR.unsupported_type=Only PNG, JPEG, WebP, and GIF images can be used as a profile photo.
error.USER_AVATAR_TOO_LARGE=The profile photo must be {0}KB or smaller.
error.USER_AVATAR_NOT_FOUND=The user has no profile photo: userId={0}

