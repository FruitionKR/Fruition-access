error.WORKSPACE_NOT_FOUND=Workspace not found: id={0}
error.WORKSPACE_TRASH_EXPIRED=The workspace can no longer be restored because its trash retention period has passed: id={0}
error.WORKSPACE_MEMBER_NOT_FOUND=Workspace member not found: workspaceId={0} userId={1}
error.WORKSPACE_ACCESS_DENIED.invite=OWNER permission is required to invite members.
error.WORKSPACE_ACCESS_DENIED.remove_member=OWNER permission is required to remove other members.
error.WORKSPACE_ACCESS_DENIED.change_role=OWNER permission is required to change member roles.
error.LAST_OWNER=The last OWNER of a workspace cannot be changed or removed: workspaceId={0}
