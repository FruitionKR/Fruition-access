# 기본(한국어) 메일 템플릿. 수신자 언어가 en이 아니면 이 파일을 쓴다.
# 인자({0})가 있는 문구는 MessageFormat으로 처리하므로 작은따옴표를 ''로 적는다.
# 키 집합은 mail_en.properties와 같아야 한다(MessageBundleConsistencyTest).

# 인증번호 메일. {0}=동작 이름, {1}=인증번호
mail.verification.subject.signup=[Fruition] 회원가입 인증번호
mail.verification.subject.email_change=[Fruition] 이메일 변경 인증번호
mail.verification.subject.password_reset=[Fruition] 비밀번호 재설정 인증번호
mail.verification.subject.password_change=[Fruition] 비밀번호 변경 인증번호
mail.verification.subject.default=[Fruition] 인증번호
mail.verification.action.signup=회원가입
mail.verification.action.email_change=이메일 변경
mail.verification.action.password_reset=비밀번호 재설정
mail.verification.action.password_change=비밀번호 변경
mail.verification.body=Fruition {0} 인증번호는 아래와 같습니다.\n\n\
인증번호: {1}\n\n\
인증번호를 요청하지 않으셨다면 이 메일을 무시하셔도 됩니다.

# 워크스페이스 초대 메일. {0}=워크스페이스 이름, {1}=초대한 사람, {2}=수락 링크
mail.invitation.subject=[Fruition] {0} 워크스페이스에 초대되었습니다
mail.invitation.body={1}님이 회원님을 ''{0}'' 워크스페이스에 초대했습니다.\n\n\
아래 링크에서 초대를 수락하세요.\n\
{2}\n\n\
이 링크는 이 메일을 받은 주소의 계정으로 로그인했을 때만 수락됩니다.\n\
초대를 요청하지 않으셨다면 이 메일을 무시하셔도 됩니다.

# 이메일 변경 알림(기존 주소로 발송). {0}=가린 새 이메일, {1}=변경 시각
mail.email_change.subject=[Fruition] 계정 이메일이 변경되었습니다
mail.email_change.body=Fruition 계정의 로그인 이메일이 변경되었습니다.\n\n\
새 이메일: {0}\n\
변경 시각: {1}\n\n\
본인이 변경했다면 이 메일을 무시하셔도 됩니다.\n\n\
본인이 변경하지 않았다면 계정이 도용되었을 수 있습니다. 이 주소로는 더 이상 로그인하거나 \
비밀번호를 재설정할 수 없으니, 즉시 Fruition 운영팀에 알려 계정 복구를 요청해 주세요. \
같은 비밀번호를 쓰는 다른 서비스의 비밀번호도 바꾸시길 권합니다.
