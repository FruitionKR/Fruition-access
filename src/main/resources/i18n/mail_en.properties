# English mail templates. Used when the recipient language is en.
# Messages with arguments ({0}) go through MessageFormat, so a single quote must be written as ''.
# The key set must match mail.properties (MessageBundleConsistencyTest).

# Verification code mail. {0}=action name, {1}=code
mail.verification.subject.signup=[Fruition] Sign-up verification code
mail.verification.subject.email_change=[Fruition] Email change verification code
mail.verification.subject.password_reset=[Fruition] Password reset verification code
mail.verification.subject.password_change=[Fruition] Password change verification code
mail.verification.subject.default=[Fruition] Verification code
mail.verification.action.signup=sign-up
mail.verification.action.email_change=email change
mail.verification.action.password_reset=password reset
mail.verification.action.password_change=password change
mail.verification.body=Here is your Fruition {0} verification code.\n\n\
Verification code: {1}\n\n\
If you did not request this code, you can ignore this email.

# Workspace invitation mail. {0}=workspace name, {1}=inviter, {2}=accept link
mail.invitation.subject=[Fruition] You have been invited to the {0} workspace
mail.invitation.body={1} has invited you to the ''{0}'' workspace.\n\n\
Accept the invitation at the link below.\n\
{2}\n\n\
This link can only be accepted while signed in with the account for the address that received this email.\n\
If you were not expecting this invitation, you can ignore this email.

# Email change notice (sent to the previous address). {0}=masked new email, {1}=changed at
mail.email_change.subject=[Fruition] Your account email has been changed
mail.email_change.body=The sign-in email for your Fruition account has been changed.\n\n\
New email: {0}\n\
Changed at: {1}\n\n\
If you made this change, you can ignore this email.\n\n\
If you did not make this change, your account may have been compromised. You can no longer sign in or \
reset your password with this address, so please contact the Fruition team right away to recover your account. \
We also recommend changing the password of any other service where you use the same password.
