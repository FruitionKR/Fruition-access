# 기본(한국어) 메시지 번들. Accept-Language가 없거나 ko·en이 아니면 이 파일을 쓴다.
# 인자({0})가 있는 문구는 MessageFormat으로 처리하므로 작은따옴표를 ''로 적는다.
# 키 집합은 messages_en.properties와 같아야 한다(MessageBundleConsistencyTest).

