# AWS에서는 별도 migration Job을 먼저 실행하고 runtime은 스키마 검증만 한다.
spring.flyway.enabled=false
spring.datasource.password=${ACCESS_DB_RUNTIME_PASSWORD}
# 운영 RDS 연결 수 상한. API replica 수 x maximum-pool-size가 DB max_connections 안에 머물게 한다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
