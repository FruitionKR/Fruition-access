name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test
  # 모델 목록 기준은 Fruition-document dev다(Fruition-document#45). 다르면 실패한다.
  model-catalog-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-ai-model-catalog.py --self-test
      - run: python3 scripts/check-ai-model-catalog.py
